<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Multi-Site Viewer</title>
  <style>
    :root {
      --bg: #eef1f4;
      --surface: #fff;
      --bar: #f6f8fa;
      --text: #16202a;
      --muted: #5d6b78;
      --line: #d8dee4;
      --accent: #0b6e78;
      --accent-ink: #fff;
      --shadow: 0 1px 2px rgba(20, 30, 40, .06), 0 6px 20px rgba(20, 30, 40, .07);
      --danger: #b3322b;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1419;
        --surface: #182029;
        --bar: #1e2832;
        --text: #e6ebf0;
        --muted: #93a1ae;
        --line: #2b3744;
        --accent: #4fc3cf;
        --accent-ink: #06242a;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
        --danger: #ff8a80;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1419;
      --surface: #182029;
      --bar: #1e2832;
      --text: #e6ebf0;
      --muted: #93a1ae;
      --line: #2b3744;
      --accent: #4fc3cf;
      --accent-ink: #06242a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      --danger: #ff8a80;
      color-scheme: dark;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: background .25s, color .25s
    }

    button,
    input {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    header.top {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
      justify-content: space-between;
      padding: 14px clamp(12px, 2vw, 24px)
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -.01em
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .seg {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 3px;
      gap: 2px
    }

    .seg button {
      border: 0;
      background: transparent;
      padding: 6px 12px;
      border-radius: 7px;
      color: var(--muted);
      transition: background .2s, color .2s
    }

    .seg button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 10px;
      padding: 7px 12px;
      transition: background .2s, border-color .2s
    }

    .btn:hover {
      border-color: var(--accent)
    }

    .note {
      margin: 0 clamp(12px, 2vw, 24px) 12px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      color: var(--muted);
      font-size: .88rem;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-start
    }

    .note button {
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      padding: 0 4px
    }

    .tabs {
      display: none;
      gap: 6px;
      overflow-x: auto;
      padding: 0 clamp(12px, 2vw, 24px) 10px
    }

    .tabs button {
      flex: none;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 6px 14px;
      color: var(--muted);
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .tabs button[aria-selected="true"] {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent)
    }

    body[data-layout="single"] .tabs {
      display: flex
    }

    main {
      display: grid;
      gap: clamp(10px, 1.4vw, 18px);
      padding: 0 clamp(12px, 2vw, 24px) 24px;
      grid-template-columns: 1fr;
      grid-auto-rows: minmax(340px, 62vh)
    }

    @media (min-width:700px) {
      main {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: minmax(320px, 38vh)
      }
    }

    @media (min-width:1100px) {
      main {
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: minmax(320px, calc((100vh - 170px)/2))
      }
    }

    body[data-layout="two"] main {
      grid-template-columns: repeat(2, 1fr)
    }

    @media (max-width:699px) {
      body[data-layout="two"] main {
        grid-template-columns: 1fr
      }
    }

    body[data-layout="single"] main {
      grid-template-columns: 1fr;
      grid-auto-rows: minmax(420px, calc(100vh - 190px))
    }

    body[data-layout="single"] .panel:not(.active) {
      display: none
    }

    .panel {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 0;
      transition: background .25s, border-color .25s
    }

    .panel.expanded {
      position: fixed;
      inset: 0;
      z-index: 50;
      border-radius: 0;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      animation: grow .22s ease-out
    }

    @keyframes grow {
      from {
        transform: scale(.96);
        opacity: .6
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    body.has-expanded {
      overflow: hidden
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bar);
      border-bottom: 1px solid var(--line)
    }

    .title {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      font-size: .92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .title small {
      font-weight: 400;
      color: var(--muted)
    }

    .icons {
      display: flex;
      gap: 2px
    }

    .icons button,
    .back {
      border: 0;
      background: transparent;
      border-radius: 8px;
      padding: 5px 8px;
      color: var(--muted);
      transition: background .15s, color .15s
    }

    .icons button:hover,
    .back:hover {
      background: var(--line);
      color: var(--text)
    }

    .icons button:disabled {
      opacity: .35;
      pointer-events: none
    }

    .icons .rm:hover {
      color: var(--danger)
    }

    .back {
      display: none;
      color: var(--text);
      font-weight: 600
    }

    .panel.expanded .back {
      display: block
    }

    .panel.expanded .exp {
      display: none
    }

    .entry {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line)
    }

    .entry input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 9px;
      padding: 7px 10px
    }

    .entry input:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent)
    }

    .entry .go {
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 9px;
      padding: 7px 14px;
      font-weight: 600
    }

    .entry .err {
      color: var(--danger)
    }

    .view {
      position: relative;
      flex: 1;
      min-height: 0;
      background: var(--surface)
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 20px;
      background: var(--surface);
      color: var(--muted)
    }

    .overlay h3 {
      margin: 0;
      color: var(--text);
      font-size: 1.05rem
    }

    .overlay p {
      margin: 0;
      max-width: 34ch;
      font-size: .9rem
    }

    .overlay .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center
    }

    .panel[data-state="empty"] .empty,
    .panel[data-state="blocked"] .blocked,
    .panel[data-state="loading"] .loading {
      display: flex
    }

    .panel[data-state="loading"] .loading {
      background: color-mix(in srgb, var(--surface) 80%, transparent)
    }

    .spinner {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .btn.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      font-weight: 600
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body data-layout="grid">
  <header class="top">
    <h1>Multi-Site Viewer</h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Layout">
        <button data-layout="grid" aria-pressed="true">6 grid</button>
        <button data-layout="two" aria-pressed="false">2 columns</button>
        <button data-layout="single" aria-pressed="false">Tabs</button>
      </div>
      <button class="btn" id="theme" aria-label="Toggle dark or light mode">Theme</button>
    </div>
  </header>
  <div class="note" id="note"><span>Some sites (Google, Facebook, YouTube pages, banks and many others) block embedding
      by design. When that happens, the panel offers an Open in new tab button instead.</span><button id="noteClose"
      aria-label="Dismiss note">×</button></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sites"></nav>
  <main id="grid"></main>

  <script>
    (function () {
      var KEY = "multisite-viewer-v1", N = 6, TIMEOUT = 15000;
      var BLOCKED = /(^|\.)(google\.[a-z.]+|facebook\.com|instagram\.com|youtube\.com|x\.com|twitter\.com|linkedin\.com|github\.com|paypal\.com|amazon\.[a-z.]+|netflix\.com|reddit\.com|whatsapp\.com|bing\.com)$/i;
      var EXAMPLES = ["https://xnxx.com", "https://pornhub.com", "https://www.openstreetmap.org", "https://developer.mozilla.org", "https://www.w3.org", "https://news.ycombinator.com"];
      /* ===== APNAY 6 LINKS YAHAN DALEIN (add your 6 links here) ===== */
      var SITES = [
        "https://xnxx.com",
        "https://pornhub.com",
        "https://www.openstreetmap.org",
        "https://developer.mozilla.org",
        "https://www.w3.org",
        "https://news.ycombinator.com"
      ];
      /* =============================================================== */
      var state = { urls: SITES.map(function (s) { return normalize(s) || "" }).concat(Array(N).fill("")).slice(0, N), layout: "grid", theme: "", active: 0, noteHidden: false };
      var grid = document.getElementById("grid"), tabs = document.getElementById("tabs"), panels = [], timers = [];

      function load() { try { var s = JSON.parse(localStorage.getItem(KEY)); if (s) { ["layout", "theme"].forEach(function (k) { if (typeof s[k] === "string") state[k] = s[k] }); state.noteHidden = !!s.noteHidden } } catch (e) { } }
      function save() { try { localStorage.setItem(KEY, JSON.stringify(state)) } catch (e) { } }

      function normalize(v) {
        v = (v || "").trim(); if (!v) return null;
        if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = "https://" + v;
        try { var u = new URL(v); if (!/^https?:$/.test(u.protocol) || !/\./.test(u.hostname) && u.hostname !== "localhost") return null; return u.href } catch (e) { return null }
      }
      function host(u) { try { return new URL(u).hostname.replace(/^www\./, "") } catch (e) { return u } }

      function build(i) {
        var p = document.createElement("section"); p.className = "panel"; p.dataset.state = "empty";
        p.innerHTML = '<div class="bar"><button class="back" title="Back to all sites">‹ Back</button><div class="title">Site ' + (i + 1) + '</div>' +
          '<div class="icons"><button class="rf" title="Refresh" aria-label="Refresh">↻</button><button class="nt" title="Open in new tab" aria-label="Open in new tab">↗</button>' +
          '<button class="exp" title="Expand" aria-label="Expand">⤢</button><button class="rm rmv" title="Remove" aria-label="Remove">✕</button></div></div>' +
          '' +
          '<div class="view"><iframe title="Site ' + (i + 1) + '" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" loading="lazy" referrerpolicy="no-referrer"></iframe>' +
          '<div class="overlay empty"><h3>No site set</h3><p>Is panel ka link code ki SITES list mein add karein.</p></div>' +
          '<div class="overlay loading"><div class="spinner" role="status" aria-label="Loading"></div><p>Loading…</p></div>' +
          '<div class="overlay blocked"><h3>This site doesn’t allow embedding</h3><p>The site refuses to be shown inside another page. You can still open it in its own tab.</p><div class="row"><button class="btn primary nt2">Open in new tab</button><button class="btn try">Try anyway</button></div></div></div>';
        var q = function (s) { return p.querySelector(s) }, f = q("iframe");
        var o = { el: p, f: f, title: q(".title"), url: "" };
        q(".rf").onclick = function () { if (o.url) setUrl(i, o.url, true) };
        var open = function () { if (o.url) window.open(o.url, "_blank", "noopener,noreferrer") };
        q(".nt").onclick = open; q(".nt2").onclick = open;
        q(".try").onclick = function () { setUrl(i, o.url, true, true) };
        q(".exp").onclick = function () { expand(i, true) }; q(".back").onclick = function () { expand(i, false) };
        q(".rm").onclick = function () { setUrl(i, "", false) };
        f.addEventListener("load", function () { if (o.loading && f.getAttribute("src") && f.getAttribute("src") !== "about:blank") finish(i) });
        return o;
      }

      function finish(i) {
        var o = panels[i]; clearTimeout(timers[i]); o.loading = false;
        try { if (o.f.contentWindow.location.href === "about:blank") { return setState(i, "blocked") } } catch (e) { }
        setState(i, "ready");
      }
      function setState(i, s) { panels[i].el.dataset.state = s }

      function setUrl(i, u, persist, force) {
        var o = panels[i]; clearTimeout(timers[i]); o.url = u; state.urls[i] = u;
        var dis = !u; o.el.querySelectorAll(".rf,.nt").forEach(function (b) { b.disabled = dis });
        if (!u) { o.f.removeAttribute("src"); o.f.src = "about:blank"; o.f.removeAttribute("src"); o.loading = false; o.title.innerHTML = "Site " + (i + 1); setState(i, "empty"); renderTabs(); save(); return }
        o.title.innerHTML = host(u) + ' <small>' + (function () { try { var p = new URL(u).pathname; return p === "/" ? "" : p } catch (e) { return "" } })() + '</small>';
        renderTabs(); save();
        if (!force && BLOCKED.test(host(u))) { o.f.src = "about:blank"; o.f.removeAttribute("src"); o.loading = false; setState(i, "blocked"); return }
        o.loading = true; setState(i, "loading"); o.f.src = "about:blank";
        setTimeout(function () { o.f.src = u }, 30);
        timers[i] = setTimeout(function () { if (o.loading) { o.loading = false; setState(i, "blocked") } }, TIMEOUT);
      }

      function expand(i, on) {
        panels[i].el.classList.toggle("expanded", on); document.body.classList.toggle("has-expanded", on);
        if (on) { panels[i].back = true }
      }
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") { panels.forEach(function (_, i) { expand(i, false) }) } });

      function renderTabs() {
        tabs.innerHTML = "";
        panels.forEach(function (p, i) {
          var b = document.createElement("button"); b.setAttribute("role", "tab");
          b.setAttribute("aria-selected", String(i === state.active)); b.textContent = state.urls[i] ? host(state.urls[i]) : "Site " + (i + 1);
          b.onclick = function () { state.active = i; applyLayout(); save() }; tabs.appendChild(b)
        });
      }
      function applyLayout() {
        document.body.dataset.layout = state.layout;
        document.querySelectorAll(".seg button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.layout === state.layout)) });
        panels.forEach(function (p, i) { p.el.classList.toggle("active", i === state.active) });
        tabs.querySelectorAll("button").forEach(function (b, i) { b.setAttribute("aria-selected", String(i === state.active)) });
      }
      document.querySelectorAll(".seg button").forEach(function (b) { b.onclick = function () { state.layout = b.dataset.layout; applyLayout(); save() } });

      function applyTheme() {
        var r = document.documentElement; if (state.theme) r.setAttribute("data-theme", state.theme); else r.removeAttribute("data-theme");
      }
      document.getElementById("theme").onclick = function () {
        var dark = state.theme ? state.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        state.theme = dark ? "light" : "dark"; applyTheme(); save();
      };
      var note = document.getElementById("note");
      document.getElementById("noteClose").onclick = function () { note.style.display = "none"; state.noteHidden = true; save() };

      load(); applyTheme();
      if (state.noteHidden) note.style.display = "none";
      for (var i = 0; i < N; i++) { panels.push(build(i)); grid.appendChild(panels[i].el); panels[i].el.querySelectorAll(".rf,.nt").forEach(function (b) { b.disabled = true }) }
      renderTabs(); applyLayout();
      state.urls.forEach(function (u, i) { if (u) setUrl(i, u) });
    })();
  </script>
</body>

</html>
